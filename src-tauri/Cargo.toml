[package]
name = "icetools"
version = "1.2.0"
description = "All-in-one Windows optimizer desktop app"
authors = ["RNC-Tech"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "icetools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
sysinfo = "0.33"
